appId: com.momospend.app
---
- runFlow: ../setupApp.yml
- tapOn:
    id: 'tabBarSettingsBtn'
- scrollUntilVisible:
    element:
      id: 'settingsLockToggle'
- tapOn:
    label: 'Can switch Lock the app on'
    id: 'settingsLockToggle'
- assertVisible:
    id: 'settingsLockToggle'
    checked: true
- tapOn:
    label: 'Can switch Lock the app off'
    id: 'settingsLockToggle'
- assertVisible:
    id: 'settingsLockToggle'
    checked: false
