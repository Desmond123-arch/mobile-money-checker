appId: com.momospend.app
---
- runFlow: ../setupApp.yml
- openLink: 'momospend://permission'
- assertVisible:
    id: 'permissionScreen'
- tapOn:
    label: 'Not now leads to the denied screen'
    id: 'notNowLink'
- assertVisible:
    id: 'permissionDeniedScreen'
- tapOn:
    label: 'Can keep looking around without access'
    id: 'keepLookingLink'
- assertVisible:
    id: 'homeScreen'
