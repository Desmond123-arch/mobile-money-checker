appId: com.momospend.app
---
- runFlow: ../setupApp.yml
- tapOn:
    id: 'tabBarSettingsBtn'
- scrollUntilVisible:
    element:
      id: 'settingsUnreadRow'
- tapOn:
    id: 'settingsUnreadRow'
- assertVisible:
    id: 'unreadMessagesScreen'
- assertVisible:
    id: 'unreadMessage-u1'
- assertVisible:
    id: 'unreadAdd-u2'
- tapOn:
    label: 'Can ignore a message'
    id: 'unreadIgnore-u1'
- assertNotVisible:
    id: 'unreadMessage-u1'
- tapOn:
    id: 'unreadIgnore-u2'
- assertVisible:
    id: 'unreadEmpty'
- tapOn:
    id: 'backBtn'
- assertVisible:
    id: 'settingsScreen'
